model:
  name: "roberta-base"
  num_labels: 6
  labels_list: ['sadness', 'joy', 'love', 'anger', 'fear', 'surprise']

data:
  processed_dir: "./data/processed"

tuning:
  output_dir: "./saved_models/roberta_emotion_tuning"
  n_trials: 5          
  train_batch_size: 32
  eval_batch_size: 32
  num_epochs: 2          
  early_stopping_patience: 1
  fp16: true